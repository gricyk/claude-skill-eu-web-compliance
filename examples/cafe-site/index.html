<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Example Café – coffee in Brno</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-EXAMPLE123"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-EXAMPLE123');
  </script>
  <script src="/assets/cookie-banner.js" defer></script>
  <script src="/assets/chat-widget.js" defer></script>
</head>
<body>
  <header>
    <img src="/img/logo.svg">
    <div class="menu-toggle" onclick="toggleMenu()">☰</div>
    <nav id="menu">
      <a href="/">Home</a>
      <a href="/events.html">Events</a>
      <a href="/blog/ai-latte-art.html">Blog</a>
      <a href="/privacy.html">Privacy</a>
    </nav>
  </header>

  <main>
    <h1>Example Café</h1>
    <h3>Specialty coffee since 2019</h3>
    <img src="/img/interior.jpg">

    <h2>See how we roast</h2>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/EXAMPLEVID1" title="Roasting video"></iframe>

    <h2>Find us</h2>
    <iframe src="https://www.google.com/maps/embed?pb=EXAMPLE" width="600" height="300" title="Map"></iframe>

    <h2>Get our newsletter</h2>
    <form action="/api/newsletter" method="post">
      <input type="email" name="email" placeholder="Your email">
      <button type="submit">Subscribe</button>
    </form>

    <h2>Contact us</h2>
    <form action="/api/contact" method="post">
      <label for="c-name">Name</label>
      <input type="text" id="c-name" name="name">
      <label for="c-email">Email</label>
      <input type="email" id="c-email" name="email">
      <textarea name="message" placeholder="Your message"></textarea>
      <input type="checkbox" id="c-news" name="newsletter" checked>
      <label for="c-news">I agree to the privacy policy and want to receive the newsletter</label>
      <div class="g-recaptcha" data-sitekey="EXAMPLE_SITE_KEY"></div>
      <script src="https://www.google.com/recaptcha/api.js" async defer></script>
      <button type="submit">Send</button>
    </form>
  </main>

  <footer>
    <p>© Example Café</p>
  </footer>
  <div id="chat-root"></div>
</body>
</html>
